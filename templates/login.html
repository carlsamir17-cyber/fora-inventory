<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>تسجيل دخول - مصنع فورا</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { font-family: Arial; background:#f6f6f6; margin:0; }
    .box { max-width: 360px; margin: 60px auto; background:#fff; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
    input { width:100%; padding:12px; font-size:16px; margin-top:8px; border:1px solid #ddd; border-radius:10px; }
    button { width:100%; padding:12px; font-size:16px; margin-top:12px; border:none; border-radius:10px; background:#111; color:#fff; cursor:pointer; }
    .msg { margin-top:10px; color:#b00020; white-space:pre-line; }
  </style>
</head>
<body>
  <div class="box">
    <h2>تسجيل دخول</h2>
    <form method="post">
      <label>كلمة المرور</label>
      <input type="password" name="password" autofocus />
      <button type="submit">دخول</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="msg">
          {% for cat, m in messages %}
            {{ m }}
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
